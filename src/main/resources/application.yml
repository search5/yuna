spring:
  profiles:
    active: mariadb
  messages:
    basename: messages/messages
    encoding: UTF-8
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-client-id
            client-secret: dummy-client-secret
            scope: profile,email
          github:
            client-id: dummy-client-id
            client-secret: dummy-client-secret
            scope: user:email,read:user

yuna:
  upload:
    base-dir: "${yona.data:data}/uploads"
  signup:
    allowed-email-domains: "${YUNA_SIGNUP_ALLOWED_EMAIL_DOMAINS:}"
  ldap:
    enabled: "${YUNA_LDAP_ENABLED:false}"
    host: "${YUNA_LDAP_HOST:127.0.0.1}"
    port: "${YUNA_LDAP_PORT:389}"
    protocol: "${YUNA_LDAP_PROTOCOL:ldap}"
    base-dn: "${YUNA_LDAP_BASE_DN:}"
    dn-postfix: "${YUNA_LDAP_DN_POSTFIX:}"
    login-property: "${YUNA_LDAP_LOGIN_PROPERTY:sAMAccountName}"
    display-name-property: "${YUNA_LDAP_DISPLAY_NAME_PROPERTY:displayName}"
    user-name-property: "${YUNA_LDAP_USER_NAME_PROPERTY:CN}"
    email-property: "${YUNA_LDAP_EMAIL_PROPERTY:mail}"
    department-property: "${YUNA_LDAP_DEPARTMENT_PROPERTY:department}"
    english-name-property: "${YUNA_LDAP_ENGLISH_NAME_PROPERTY:}"
    use-email-base-login: "${YUNA_LDAP_USE_EMAIL_BASE_LOGIN:false}"
    fallback-to-local-login: "${YUNA_LDAP_FALLBACK_TO_LOCAL_LOGIN:false}"
    guest-login-id-prefix: "${YUNA_LDAP_GUEST_LOGIN_ID_PREFIX:}"
  mailbox:
    imap:
      enabled: "${YUNA_IMAP_ENABLED:false}"
      host: "${YUNA_IMAP_HOST:}"
      user: "${YUNA_IMAP_USER:}"
      password: "${YUNA_IMAP_PASSWORD:}"
      ssl: "${YUNA_IMAP_SSL:true}"
      folder: "${YUNA_IMAP_FOLDER:inbox}"
      address: "${YUNA_IMAP_ADDRESS:}"
      polling-interval-ms: "${YUNA_IMAP_POLLING_INTERVAL_MS:300000}"

yona:
  feedback-url: "${YONA_FEEDBACK_URL:https://github.com/yona-projects/yona/issues}"
  translation:
    api: "${YONA_TRANSLATION_API:}"
    header-key: "${YONA_TRANSLATION_HEADER_KEY:}"
    header-value: "${YONA_TRANSLATION_HEADER_VALUE:}"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-client-id
            client-secret: dummy-client-secret
            scope: profile,email
          github:
            client-id: dummy-client-id
            client-secret: dummy-client-secret
            scope: user:email,read:user
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: yuna

---
spring:
  config:
    activate:
      on-profile: mariadb
  datasource:
    url: jdbc:mariadb://localhost:23306/yona?characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: yona
    password: yona_password
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/yona
    username: yona
    password: yona_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate: WARN

