<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko"
      th:with="pullRequestMenuLabel=#{menu.pullRequest}, pageTitle=${pr.title + ' - ' + pullRequestMenuLabel}">
<head th:replace="~{site/layout :: head(title=${pageTitle})}">
</head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'pullRequest')}"></div>

    <!--
     legacy git/view.scala.html("overview") + git/viewChanges.scala.html("changes") 대응(그룹11
     #170/#171). 두 legacy 화면은 서로 다른 URL이지만 pullrequest/view.html 하나로 합쳐 tab 모델
     속성(overview|changes)에 따라 분기한다 — URL 라우팅은 legacy와 동일하게 별도로 유지된다
     (/pull/{number} = overview, /pull/{number}/changes[/{commitId}] = changes, 컨트롤러 참고).
    -->
    <div class="page-wrap-outer">
        <div class="project-page-wrap" th:classappend="${tab == 'changes'} ? 'code-browse-wrap' : ''">

            <div th:replace="~{pullrequest/partial_info :: info(${project}, ${pr}, ${currentUser}, ${tab}, ${openThreadCount}, ${isAcceptable}, ${disabledAcceptReason})}"></div>

            <!-- ===================== OVERVIEW 탭 (legacy git/view.scala.html) ===================== -->
            <th:block th:if="${tab == 'overview'}">
                <div class="board-body">
                    <div class="author-info left-txt" style="margin-top:20px;">
                        <a th:href="@{/user/{loginId}(loginId=${pr.contributor.loginId})}" class="usf-group pull-left">
                            <span class="avatar-wrap smaller">
                                <img th:src="${pr.contributor.avatarUrl}" width="32" height="32">
                            </span>
                            <strong class="name" th:text="${pr.contributor.name}">보낸 사람</strong>
                            <span class="loginid"> <strong>@</strong><span th:text="${pr.contributor.loginId}">loginId</span></span>
                        </a>
                        <div th:replace="~{pullrequest/partial_branch :: branch(${pr})}"></div>
                    </div>
                    <div class="content markdown-wrap" th:utext="${markdownService.render(pr.body, true, project)}">본문 내용</div>
                    <div class="attachments" id="attachments" th:data-attachments="${attachmentsJson}"></div>
                </div>

                <!-- 연동된 자동 닫기 이슈 정보(legacy에는 없는 yuna 확장 — 기존 세션에서 이미 정착됨, 유지) -->
                <div th:if="${referredIssues != null and !referredIssues.isEmpty()}" class="alert alert-info" style="margin-top:15px;">
                    <strong>이 풀 리퀘스트가 병합되면 다음 이슈가 자동으로 닫힙니다:</strong>
                    <ul style="margin-bottom:0;">
                        <li th:each="issue : ${referredIssues}">
                            <a th:href="@{/{owner}/{projectName}/issue/{number}(owner=${project.owner}, projectName=${project.name}, number=${issue.number})}"
                               th:text="'#' + ${issue.number} + ' ' + ${issue.title}">#123 이슈 제목</a>
                        </li>
                    </ul>
                </div>

                <div id="state" class="pullRequest-stateInfo">
                    <div th:replace="~{pullrequest/partial_state :: state(${project}, ${pr}, ${currentUser}, ${canDeleteBranch}, ${canRestoreBranch})}"></div>
                </div>

                <div class="board-footer board-actrow">
                    <div class="pull-left">
                        <button th:if="${currentUser != null}" id="watch-button" type="button" class="ybtn" th:classappend="${isWatching} ? 'ybtn-watching' : ''"
                                data-toggle="button" th:data-watching="${isWatching}"
                                th:text="${isWatching} ? #{project.unwatch} : #{project.watch}">지켜보기</button>
                    </div>

                    <div class="mr5" style="display:inline-block;">
                        <a th:if="${currentUser != null and @accessControl.isAllowed(currentUser, project, pr, T(com.github.search5.yona.domain.enumeration.Operation).UPDATE)}"
                           th:href="@{/{owner}/{projectName}/pull/{number}/edit(owner=${project.owner}, projectName=${project.name}, number=${pr.number})}" class="ybtn" th:text="#{button.edit}">수정</a>
                        <a th:if="${pr.state.name() == 'OPEN' and currentUser != null and @accessControl.isAllowed(currentUser, project, pr, T(com.github.search5.yona.domain.enumeration.Operation).CLOSE)}"
                           data-request-method="post" th:data-request-uri="@{/api/projects/{projectId}/pullrequests/{number}/state(projectId=${project.id}, number=${pr.number}, state='CLOSED')}" class="ybtn" th:text="#{pullRequest.close}">보류</a>
                        <a th:if="${pr.state.name() == 'CLOSED' and currentUser != null and @accessControl.isAllowed(currentUser, project, pr, T(com.github.search5.yona.domain.enumeration.Operation).REOPEN)}"
                           data-request-method="post" th:data-request-uri="@{/api/projects/{projectId}/pullrequests/{number}/state(projectId=${project.id}, number=${pr.number}, state='OPEN')}" class="ybtn" th:text="#{pullRequest.reopen}">다시 열기</a>
                    </div>
                </div>

                <hr class="nm">

                <div class="board-comment-wrap">
                    <ul class="comments" id="comments" th:if="${timeline != null and !timeline.isEmpty()}">
                        <th:block th:each="item : ${timeline}">
                            <div th:replace="~{pullrequest/partial_pull_request_event :: event(${project}, ${pr}, ${item.event})}"></div>
                        </th:block>
                    </ul>
                </div>

                <div class="right-txt">
                    <a href="#helpMessage" class="ybtn ybtn-inverse ybtn-mini" data-toggle="modal" th:text="#{title.help}">도움말</a>
                </div>
            </th:block>

            <!-- ===================== CHANGES 탭 (legacy git/viewChanges.scala.html) ===================== -->
            <th:block th:if="${tab == 'changes'}">
                <div class="board-body mb20">
                    <div class="author-info right-txt" style="margin-top:20px;">
                        <a th:href="@{/user/{loginId}(loginId=${pr.contributor.loginId})}" class="usf-group pull-left">
                            <span class="avatar-wrap smaller">
                                <img th:src="${pr.contributor.avatarUrl}" width="32" height="32">
                            </span>
                            <strong class="name" th:text="${pr.contributor.name}">보낸 사람</strong>
                            <span class="loginid"> <strong>@</strong><span th:text="${pr.contributor.loginId}">loginId</span></span>
                        </a>
                        <div th:replace="~{pullrequest/partial_branch :: branch(${pr})}"></div>
                    </div>
                </div>

                <div class="codediff-wrap mt10" th:classappend="${commentThreads == null or commentThreads.isEmpty()} ? 'diffs-only' : ''">
                    <button th:if="${commentThreads != null and !commentThreads.isEmpty()}" type="button" class="ybtn ybtn-default btn-show-reviewcards">
                        <i class="yobicon-restore"></i>
                    </button>
                    <div id="changes" class="diffs-wrap">
                        <div id="commits" class="btn-group auto mb10">
                            <button class="btn dropdown-toggle auto" data-toggle="dropdown">
                                <span class="d-label" th:text="${commitId == null} ? #{pullRequest.changes.all} : ${commitId}">전체</span>
                                <span class="d-caret"><span class="caret"></span></span>
                            </button>
                            <ul class="dropdown-menu">
                                <li data-value="All"><a th:href="@{/{owner}/{projectName}/pull/{number}/changes(owner=${project.owner}, projectName=${project.name}, number=${pr.number})}" th:text="#{pullRequest.changes.all}">전체</a></li>
                            </ul>
                        </div>

                        <div class="diff-body diffs-wrap-scroll">
                            <div th:replace="~{pullrequest/partial_state :: state(${project}, ${pr}, ${currentUser}, false, false)}"></div>
                            <div th:if="${diffs != null and !diffs.isEmpty()}" th:replace="~{pullrequest/partial_diff :: diff(${diffs}, ${commentThreads}, ${project}, ${pr.toProject}, ${pr.toProject})}"></div>
                            <div class="alert alert-info" th:if="${diffs == null or diffs.isEmpty()}" th:text="#{pullRequest.diff.noChanges}">변경 내역이 없습니다.</div>
                            <div class="btnPop"><button type="button" class="ybtn ybtn-info ybtn-small"><i class="yobicon-post2"></i></button></div>
                        </div>

                        <div class="board-comment-wrap">
                            <div class="non-ranged-threads-wrap">
                                <th:block th:if="${commentThreads != null}" th:each="thread : ${commentThreads}">
                                    <div th:if="${thread instanceof T(com.github.search5.yona.domain.pullrequest.NonRangedCodeCommentThread)}"
                                         th:replace="~{pullrequest/partial_comment_thread :: thread(${thread}, ${project}, ${pr})}"></div>
                                </th:block>
                            </div>
                            <th:block th:if="${currentUser != null and @accessControl.isProjectResourceCreatable(currentUser, project, T(com.github.search5.yona.domain.enumeration.ResourceType).REVIEW_COMMENT)}"
                                      th:with="reviewCommentResourceType=${T(com.github.search5.yona.domain.enumeration.ResourceType).REVIEW_COMMENT},
                                               reviewFormAction=@{/{owner}/{projectName}/pullRequest/{pullRequestId}/comments(owner=${project.owner}, projectName=${project.name}, pullRequestId=${pr.id}, commitId=${commitId})}">
                                <div th:replace="~{common/reviewForm :: reviewForm(${project}, ${reviewCommentResourceType}, ${reviewFormAction}, ${currentUser})}"></div>
                            </th:block>
                        </div>
                    </div>

                    <div class="review-wrap" th:if="${commentThreads != null and !commentThreads.isEmpty()}">
                        <div class="review-container">
                            <button type="button" class="ybtn ybtn-default btn-hide-reviewcards"><i class="yobicon-maximize"></i></button>

                            <ul class="nav nav-tabs" style="margin-bottom:10px;" th:with="openThreads=${commentThreads.?[state.name() == 'OPEN']}, closedThreads=${commentThreads.?[state.name() == 'CLOSED']}">
                                <li class="active"><a href="#reviewcards-open" data-toggle="tab" th:text="#{issue.state.open} + ' ' + ${openThreads.size()}">열림</a></li>
                                <li><a href="#reviewcards-closed" data-toggle="tab" th:text="#{issue.state.closed} + ' ' + ${closedThreads.size()}">닫힘</a></li>
                            </ul>

                            <div class="tab-content review-list" th:with="openThreads=${commentThreads.?[state.name() == 'OPEN']}, closedThreads=${commentThreads.?[state.name() == 'CLOSED']}">
                                <div id="reviewcards-open" class="tab-pane active">
                                    <div th:replace="~{pullrequest/partial_reviewlist :: reviewlist(${openThreads}, ${project}, ${pr})}"></div>
                                </div>
                                <div id="reviewcards-closed" class="tab-pane">
                                    <div th:replace="~{pullrequest/partial_reviewlist :: reviewlist(${closedThreads}, ${project}, ${pr})}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>

        </div>
    </div>

    <th:block th:replace="~{site/layout :: markdown(${project})}"></th:block>
    <th:block th:with="commentsContainerSelector=${tab == 'changes' ? '#changes' : '#comments'}">
        <div th:replace="~{common/commentDeleteModal :: commentDeleteModal(${commentsContainerSelector})}"></div>
    </th:block>

    <div id="helpMessage" class="modal hide fade pullreq-info" th:if="${tab == 'overview'}">
        <div class="modal-header">
            <h5 th:text="#{pullRequest.merge.help.1}">도움말</h5>
        </div>
        <div class="modal-body">
            <div class="row-fluid">
                <div class="pull-left help-messages mt10">
                    <p th:text="#{pullRequest.merge.help.2}"></p>
                    <p th:text="#{pullRequest.merge.help.3}"></p>
                    <p th:text="#{pullRequest.merge.help.4}"></p>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="ybtn ybtn-info ybtn-small" data-dismiss="modal" th:text="#{button.confirm}">확인</button>
        </div>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<script type="text/javascript" th:inline="javascript">
  $(document).ready(function() {
      var projectId = [[${project.id}]];
      var prNumber = [[${pr.number}]];

      // legacy git/view.scala.html $yobi.loadModule("git.View", {...}) 대응 — watch 토글
      $("#watch-button").click(function() {
          var $btn = $(this);
          var watching = $btn.data("watching") === true || $btn.data("watching") === "true";
          var url = watching ? "/unwatch" : "/watch";
          $.post(url, { "resource.type": "PULL_REQUEST", "resource.id": String([[${pr.id}]]) }, function() {
              window.location.reload();
          });
      });

      // legacy partial_info.scala.html의 accept 버튼(#btnAccept) 대응
      $("#btnAccept").click(function(e) {
          e.preventDefault();
          if (!confirm("[[#{pullRequest.merge}]]?")) { return; }
          $.ajax({
              url: '/api/projects/' + projectId + '/pullrequests/' + prNumber + '/merge',
              type: 'POST',
              success: function() { window.location.reload(); },
              error: function(xhr) {
                  var msg = (xhr.responseJSON && (xhr.responseJSON.message || xhr.responseJSON.error)) || xhr.responseText || "";
                  alert("[[#{pullRequest.merge}]] failed: " + msg);
              }
          });
      });

      // 리뷰 참여/취소 버튼(legacy ReviewApp.review/unreview)
      $("#btn-review").click(function() {
          $.post("[[@{/api/{owner}/{projectName}/pullRequest/{pullRequestId}/review(owner=${project.owner}, projectName=${project.name}, pullRequestId=${pr.id})}]]", function() { window.location.reload(); });
      });
      $("#btn-unreview").click(function() {
          $.post("[[@{/api/{owner}/{projectName}/pullRequest/{pullRequestId}/unreview(owner=${project.owner}, projectName=${project.name}, pullRequestId=${pr.id})}]]", function() { window.location.reload(); });
      });

      // [data-request-method] 범용 처리(닫기/다시열기/브랜치 삭제·복구 등)
      $('[data-request-method]').not('#btnAccept').click(function(e) {
          e.preventDefault();
          var $this = $(this);
          $.ajax({
              url: $this.data('requestUri') || $this.attr('href'),
              type: $this.data('requestMethod').toUpperCase(),
              success: function() { window.location.reload(); },
              error: function() { alert('요청을 처리하지 못했습니다.'); }
          });
      });

      // legacy git/viewChanges.scala.html의 btn-show-reviewcards / btn-hide-reviewcards 토글
      $('.btn-show-reviewcards').click(function() { $('.review-wrap').addClass('show'); });
      $('.btn-hide-reviewcards').click(function() { $('.review-wrap').removeClass('show'); });
  });
</script>
</body>
</html>
