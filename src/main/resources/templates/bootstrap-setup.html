<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="utf-8">
<title>Yona</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<link rel="shortcut icon" type="image/x-icon" href="/images/favicon.ico">
<link rel="stylesheet" type="text/css" media="screen" href="/bootstrap/css/bootstrap.css">
<link rel="stylesheet" type="text/css" media="screen" href="/stylesheets/yobi.css">
<link rel="stylesheet" type="text/css" media="screen" href="/stylesheets/yobicon/style.css">

<script type="text/javascript" src="/assets/javascripts/lib/jquery/jquery-1.9.0.js"></script>
<script type="text/javascript" src="/assets/javascripts/lib/jquery/jquery.pjax.js"></script>
<script type="text/javascript" src="/assets/javascripts/common/yobi.Common.js"></script>
<style type="text/css">
    .secret-box { width:50%; margin:20px auto; }
    .secret-wrap { text-align:center; }
    .logo {
        display: block; text-align: center; overflow: hidden;
        width: 123px; height: 55px; line-height: 55px; font-size: 2em;
        color: #fff; background-color: #f36c22; margin:50px auto;
        text-decoration: none;
    }
    .logo:hover { color:#fff; text-decoration: none; }
</style>
</head>

<body style="zoom: 1;">
<div class="page-wrap-outer">
    <div class="container page-wrap">
        <div class="page">
            <div class="secret-wrap">
                <a href="/" class="logo"><span>Yona</span></a>

                <h3>Yona</h3>

                <div class="alert alert-block secret-box">
                    <h4>사이트 관리자 계정을 생성합니다.</h4>
                    사이트 관리자의 비밀번호가 알려지지 않도록 주의해 주세요.
                </div>
            </div>
            <div class="signup-form-wrap frm-wrap">
                <!-- 에러 메시지 노출용 박스 -->
                <div class="alert alert-danger" th:if="${error}" th:text="${error}" style="margin-bottom: 15px; color: #b94a48; background-color: #f2dede; border: 1px solid #eed3d7; padding: 8px 14px; border-radius: 4px;"></div>

                <form th:action="@{/bootstrap-setup}" method="post" class="input-append">
                    <dl>
                        <dt>
                            <label for="loginId">아이디</label>
                        </dt>
                        <dd>
                            <input id="loginId" type="text" name="loginId" class="text password" placeholder="" autocomplete="off" readonly="" value="admin">
                        </dd>
                        
                        <dt>
                            <label for="uname">이름</label>
                        </dt>
                        <dd>
                            <input id="uname" type="text" name="name" class="text password" placeholder="" autocomplete="off" th:value="${name ?: ''}">
                        </dd>
                        
                        <dt>
                            <label for="email">이메일</label>
                        </dt>
                        <dd>
                            <input id="email" type="text" name="email" class="text password" placeholder="" autocomplete="off" th:value="${email ?: ''}">
                        </dd>
                        
                        <dt>
                            <label for="password">비밀번호</label>
                        </dt>
                        <dd>
                            <input id="password" type="password" name="password" class="text password" placeholder="" autocomplete="off">
                        </dd>
                        
                        <dt>
                            <label for="retypedPassword">비밀번호를 한 번 더 입력해 주세요.</label>
                        </dt>
                        <dd>
                            <input id="retypedPassword" type="password" name="retypedPassword" class="text password" placeholder="" autocomplete="off">
                        </dd>
                    </dl>
                    <div class="btns-row">
                        <button type="submit" class="ybtn ybtn-success">생성하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<footer class="page-footer-outer">
    <div class="page-footer">
        <span class="provider">Powered by <strong>Yona</strong></span>
    </div>
</footer>
<script type="text/javascript">
    $(document).ready(function(){
        $("input[name=seed]").focus();
    });
</script>
</body>
</html>
