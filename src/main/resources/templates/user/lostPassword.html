<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="utf-8">
<title>Yona - 비밀번호 찾기</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="shortcut icon" type="image/x-icon" href="/images/favicon.ico">
<link rel="stylesheet" type="text/css" media="all" href="/bootstrap/css/bootstrap.css">
<link rel="stylesheet" type="text/css" media="all" href="/stylesheets/yobicon/style.css">
<link rel="stylesheet" type="text/css" media="all" href="/stylesheets/usermenu.css">
<link rel="stylesheet" type="text/css" media="all" href="/stylesheets/yobi.css">
</head>
<body class="theme-default">
<div id="main" class="main">
  <div class="page full">
    <div class="center-wrap tag-line-wrap reset-password">
      <h1 class="title">Yona</h1>
      <p class="tag-line">21세기 프로젝트 호스팅 소프트웨어</p>
    </div>
    
    <div class="login-form-wrap frm-wrap">
      <!-- 상태 메시지 -->
      <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}" style="margin: 10px 0; color: #468847; background-color: #dff0d8; border: 1px solid #d6e9c6; padding: 8px 14px; border-radius: 4px; text-align: left;"></div>
      <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}" style="margin: 10px 0; color: #b94a48; background-color: #f2dede; border: 1px solid #eed3d7; padding: 8px 14px; border-radius: 4px; text-align: left;"></div>

      <form th:action="@{/lostPassword}" method="POST">
        <dl>
          <dd>
            <input id="loginId" name="loginId" type="text" class="text" autocomplete="off" placeholder="아이디" required autofocus>
          </dd>
          <dd>
            <input id="emailAddress" name="emailAddress" type="email" class="text" autocomplete="off" placeholder="이메일" required>
          </dd>
        </dl>

        <div class="btns-row">
          <button type="submit" class="ybtn ybtn-primary ybtn-large ybtn-fullsize">확인</button>
        </div>

        <div class="act-row mt5" style="text-align: center; margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px;">
          <a th:href="@{/login}" style="color: #0088cc; text-decoration: none; font-weight: bold;">로그인 화면으로 돌아가기</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
