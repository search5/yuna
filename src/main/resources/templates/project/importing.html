<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
  <meta charset="utf-8">
  <title>Git에서 가져오기 - Yona</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="shortcut icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="stylesheet" type="text/css" media="all" href="/bootstrap/css/bootstrap.css">
  <link rel="stylesheet" type="text/css" media="all" href="/stylesheets/yobicon/style.css">
  <link rel="stylesheet" type="text/css" media="all" href="/stylesheets/usermenu.css">
  <link rel="stylesheet" type="text/css" media="all" href="/stylesheets/yobi.css">
  <style>
    .gnb-wrap {
      background-color: #1a1c22;
      border-bottom: 1px solid #2d3038;
      padding: 10px 20px;
    }
    .gnb-brand {
      font-size: 20px;
      font-weight: bold;
      color: #fff !important;
      text-decoration: none;
    }
    .gnb-menu {
      float: right;
    }
    .gnb-menu a {
      color: #ccc;
      margin-left: 15px;
      text-decoration: none;
    }
    .gnb-menu a:hover {
      color: #fff;
    }
    .form-container {
      background: #fff;
      border: 1px solid #d8dee2;
      border-radius: 3px;
      padding: 30px;
      margin-top: 30px;
      margin-bottom: 30px;
    }
    .orange-txt {
      color: #ff5b5b;
    }
    .repo-auth-wrap {
      display: none;
      border: 1px solid #e1e4e8;
      border-radius: 3px;
      padding: 15px;
      margin-top: 10px;
      background-color: #f6f8fa;
    }
  </style>
</head>
<body class="theme-default">
<div id="main" class="main">
  <!-- GNB (상단 바) -->
  <div class="gnb-wrap clearfix">
    <a href="/" class="gnb-brand">Yona</a>
    <div class="gnb-menu">
      <span sec:authorize="isAnonymous()">
        <a th:href="@{/login}">로그인</a>
        <a th:href="@{/signup}">회원가입</a>
      </span>
      <span sec:authorize="isAuthenticated()">
        <span style="color: #fff;" sec:authentication="name">사용자</span>님
        <a th:href="@{/logout}">로그아웃</a>
      </span>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-8 col-md-offset-2">
        <div class="form-container">
          <h2 style="margin-top: 0; margin-bottom: 20px;">
            Git 저장소에서 가져오기
          </h2>

          <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}">에러 메시지</span>
          </div>

          <form id="importGit" th:action="@{/_import}" method="post">
            <div class="form-group">
              <label for="url">
                Git 저장소 URL <strong class="orange-txt">*</strong>
              </label>
              <input id="url" type="text" name="url" class="form-control" placeholder="https://github.com/user/repo.git 또는 git@github.com:user/repo.git" required>
            </div>

            <div class="form-group">
              <div class="checkbox">
                <label>
                  <input type="checkbox" id="useRepoAuth" onclick="toggleAuthWrap()"> 이 저장소는 인증(아이디/비밀번호)이 필요합니다
                </label>
              </div>

              <div id="repoAuth" class="repo-auth-wrap">
                <div class="row">
                  <div class="col-xs-6">
                    <label for="authId">사용자 ID</label>
                    <input type="text" id="authId" name="authId" class="form-control" placeholder="ID">
                  </div>
                  <div class="col-xs-6">
                    <label for="authPw">비밀번호 / 토큰</label>
                    <input type="password" id="authPw" name="authPw" class="form-control" placeholder="Password or Token">
                  </div>
                </div>
              </div>
            </div>

            <hr>

            <div class="form-group">
              <label for="project-owner">
                소유자 <strong class="orange-txt">*</strong>
              </label>
              <select id="project-owner" name="owner" class="form-control">
                <option th:value="${currentUser.loginId}" th:text="${currentUser.loginId}">사용자 ID</option>
                <option th:each="orgUser : ${orgUserList}" th:value="${orgUser.organization.name}" th:text="${orgUser.organization.name}">조직 이름</option>
              </select>
            </div>

            <div class="form-group">
              <label for="project-name">
                프로젝트 이름 <strong class="orange-txt">*</strong>
              </label>
              <input id="project-name" type="text" name="name" class="form-control" maxlength="250" placeholder="프로젝트 이름을 입력하세요" required>
            </div>

            <div class="form-group">
              <label for="description">프로젝트 설명</label>
              <textarea id="description" name="overview" class="form-control" rows="3" placeholder="프로젝트에 대한 간단한 설명을 적어주세요"></textarea>
            </div>

            <div class="form-group">
              <label>공개 범위</label>
              <div class="radio">
                <label>
                  <input type="radio" id="public" name="projectScope" value="PUBLIC" checked>
                  <strong>공개 (Public)</strong>
                  <p class="help-block">모든 사용자가 프로젝트를 조회할 수 있습니다.</p>
                </label>
              </div>
              <div class="radio">
                <label>
                  <input type="radio" id="private" name="projectScope" value="PRIVATE">
                  <strong>비공개 (Private)</strong>
                  <p class="help-block">프로젝트 멤버만 프로젝트를 조회할 수 있습니다.</p>
                </label>
              </div>
            </div>

            <hr>

            <div class="form-group">
              <label>프로젝트 메뉴 설정</label>
              <div>
                <label class="checkbox-inline">
                  <input type="checkbox" name="code" value="true" checked> 코드
                </label>
                <label class="checkbox-inline">
                  <input type="checkbox" name="issue" value="true" checked> 이슈
                </label>
                <label class="checkbox-inline">
                  <input type="checkbox" name="pullRequest" value="true" checked> 풀 리퀘스트
                </label>
                <label class="checkbox-inline">
                  <input type="checkbox" name="review" value="true" checked> 리뷰
                </label>
                <label class="checkbox-inline">
                  <input type="checkbox" name="milestone" value="true" checked> 마일스톤
                </label>
                <label class="checkbox-inline">
                  <input type="checkbox" name="board" value="true" checked> 게시판
                </label>
              </div>
            </div>

            <div class="actions" style="margin-top: 30px;">
              <button type="submit" class="btn btn-primary">프로젝트 생성</button>
              <a href="/" class="btn btn-default">취소</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleAuthWrap() {
    var checkBox = document.getElementById("useRepoAuth");
    var authWrap = document.getElementById("repoAuth");
    if (checkBox.checked == true){
      authWrap.style.display = "block";
    } else {
      authWrap.style.display = "none";
      document.getElementById("authId").value = "";
      document.getElementById("authPw").value = "";
    }
  }
</script>
</body>
</html>
