<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
<meta charset="utf-8">
<title th:text="${project.name} + ' - 삭제'">Yona</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="shortcut icon" type="image/x-icon" href="/images/favicon.ico">
<link rel="stylesheet" type="text/css" media="all" href="/bootstrap/css/bootstrap.css">
<link rel="stylesheet" type="text/css" media="all" href="/stylesheets/yobicon/style.css">
<link rel="stylesheet" type="text/css" media="all" href="/stylesheets/usermenu.css">
<link rel="stylesheet" type="text/css" media="all" href="/stylesheets/yobi.css">
<style>
  .gnb-wrap {
      background-color: #1a1c22;
      border-bottom: 1px solid #2d3038;
      padding: 10px 20px;
  }
  .gnb-brand {
      font-size: 20px;
      font-weight: bold;
      color: #fff !important;
      text-decoration: none;
  }
  .gnb-menu {
      float: right;
  }
  .gnb-menu a {
      color: #ccc;
      margin-left: 15px;
      text-decoration: none;
  }
  .gnb-menu a:hover {
      color: #fff;
  }
  .project-header {
      background-color: #f8f9fa;
      padding: 20px;
      border-bottom: 1px solid #e9ecef;
      margin-bottom: 20px;
  }
  .setting-container {
      background: #fff;
      border: 1px solid #d8dee2;
      border-radius: 3px;
      padding: 20px;
      margin-bottom: 20px;
  }
  .modal.hide {
      display: none;
  }
</style>
<script type="text/javascript" src="/javascripts/lib/jquery/jquery-1.9.0.js"></script>
<script type="text/javascript" src="/bootstrap/js/bootstrap.min.js"></script>
<script type="text/javascript" src="/javascripts/common/yobi.common.js"></script>
</head>
<body class="theme-default">
<div id="main" class="main">
  <!-- GNB (상단 바) -->
  <div class="gnb-wrap clearfix">
    <a href="/" class="gnb-brand">Yona</a>
    <div class="gnb-menu">
      <span sec:authorize="isAnonymous()">
        <a th:href="@{/login}">로그인</a>
        <a th:href="@{/signup}">회원가입</a>
      </span>
      <span sec:authorize="isAuthenticated()">
        <span style="color: #fff;" sec:authentication="name">사용자</span>님
        <a th:href="@{/logout}">로그아웃</a>
      </span>
    </div>
  </div>

  <!-- 프로젝트 헤더 -->
  <div class="project-header">
    <div class="container">
      <h2>
        <a th:href="@{/projects/{owner}/{name}(owner=${project.owner}, name=${project.name})}" th:text="${project.owner} + ' / ' + ${project.name}">Owner / Project</a>
      </h2>
    </div>
  </div>

  <!-- 메인 컨텐츠 영역 -->
  <div class="container">
    <div class="row">
      <div class="col-md-9">
        <div class="setting-container">
          <div th:replace="~{project/setting_menu :: menu(${project}, 'delete')}"></div>
          <h3 style="margin-top: 0; margin-bottom: 20px;" th:text="#{project.delete}">프로젝트 삭제</h3>
          
          <div class="bubble-wrap gray wp">
              <div class="cu-label" style="font-weight: bold; margin-bottom: 5px;" th:text="#{project.delete}">프로젝트 삭제</div>
              <div class="cu-desc">
                  <p><strong class="notice" th:text="#{project.delete.description}">프로젝트를 삭제하면 이슈, 위키, 저장소 등 프로젝트에 기록된 모든 데이터가 삭제되며, 복구할 수 없습니다.</strong></p>
                  <p style="margin-top: 15px;">
                      <input type="checkbox" class="checkbox" autocomplete="off" id="accept" style="display: inline-block; vertical-align: middle; margin-right: 5px;"><!--
                   --><label for="accept" class="bg-checkbox label-agreement" style="display: inline-block; vertical-align: middle;" th:text="#{project.delete.accept}">프로젝트를 삭제하는데 동의합니다.</label>
                  </p>
              </div>
          </div>
          <div class="box-wrap bottom" style="margin-top: 20px;">
              <a id="btnDelete" href="#alertDeletion" class="ybtn ybtn-danger" data-toggle="modal" ><!--
               --><i class="yobicon-database-remove"></i> <span th:text="#{project.delete.this}">프로젝트를 삭제합니다.</span></a>
          </div>

          <div id="alertDeletion" class="modal hide fade" tabindex="-1" role="dialog" aria-hidden="true" style="display: none;">
              <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal">×</button>
                  <h3 th:text="#{project.delete.requestion}">프로젝트를 삭제하시겠습니까?</h3>
              </div>
              <div class="modal-body">
                  <p th:text="#{project.delete.description}">프로젝트를 삭제하면 이슈, 위키, 저장소 등 프로젝트에 기록된 모든 데이터가 삭제되며, 복구할 수 없습니다.</p>
                  <p th:text="#{project.delete.reaccept}">정말로 이관하시겠습니까?</p>
              </div>
              <div class="modal-footer">
                  <button id="btnDeleteExec" type="button" class="ybtn ybtn-danger" th:text="#{button.yes}">예</button>
                  <button type="button" class="ybtn" data-dismiss="modal" th:text="#{button.no}">아니오</button>
              </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript" src="/javascripts/service/yobi.project.Delete.js"></script>
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function(){
        $yobi.loadModule("project.Delete", {
            "sDeleteURL": /*[[ @{/{owner}/{name}/delete(owner=${project.owner}, name=${project.name})} ]]*/ ''
        });
    });
</script>
</body>
</html>
